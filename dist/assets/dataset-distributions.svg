l="#2b6172">F</text><text x="1371" y="852" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" fill="#17364d">Keypoint visibility</text><rect x="1378" y="1127.3697151721178" width="98.33333333333333" height="2.6302848278821083" rx="4" fill="#2b6172" stroke="none" stroke-width="2"/><text x="1378" y="1113.3697151721178" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#17364d">759 · 1.1%</text><text x="1378" y="1157" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#17364d">0</text><rect x="1500.3333333333333" y="1095.0924122908348" width="98.33333333333333" height="34.90758770916532" rx="4" fill="#2b6172" stroke="none" stroke-width="2"/><text x="1500.3333333333333" y="1081.0924122908348" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#17364d">10,073 · 14.1%</text><text x="1500.3333333333333" y="1157" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#17364d">1</text><rect x="1622.6666666666667" y="920" width="98.33333333333333" height="210" rx="4" fill="#2b6172" stroke="none" stroke-width="2"/><text x="1622.6666666666667" y="906" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#17364d">60,598 · 84.8%</text><text x="1622.6666666666667" y="1157" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#17364d">2</text><text x="1365" y="1189" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6c76">0 = outside; 1 = occluded; 2 = visible</text></svg>
